name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "data/summary.json"
      - "dashboard/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # The dashboard is fully static; the only thing it needs at build time
      # is a fresh copy of the aggregated summary (data/feed_database.json
      # stays out of the published site — it's the raw history, not the
      # dashboard's input).
      - name: Assemble dashboard site
        run: |
          mkdir -p site/data
          cp -r dashboard/. site/
          cp data/summary.json site/data/summary.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
